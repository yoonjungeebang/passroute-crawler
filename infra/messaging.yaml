sAWSTemplateFormatVersion: '2010-09-09'
Description: >
  passroute-crawler 메시징 (SQS + EventBridge)

Parameters:
  CrawlerDataBucketName:
    Type: String
    Description: S3 버킷명 (EventBridge 이벤트 패턴용)

Resources:
  # ── SQS: 공고 단위 상세 크롤링 큐 ──
  JobDetailQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-job-detail-queue
      VisibilityTimeout: 360
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobDetailDLQ.Arn
        maxReceiveCount: 3

  JobDetailDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-job-detail-dlq
      MessageRetentionPeriod: 604800
      SqsManagedSseEnabled: true
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !GetAtt JobDetailQueue.Arn

  # ── SQS: 임베딩 큐 (S3 raw/ 이벤트 → embed_worker) ──
  EmbedQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-embed-queue
      VisibilityTimeout: 360
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EmbedDLQ.Arn
        maxReceiveCount: 3

  EmbedDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-embed-dlq
      MessageRetentionPeriod: 604800
      SqsManagedSseEnabled: true
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !GetAtt EmbedQueue.Arn

  # ── SQS: DB 적재 큐 (S3 parsed/ 이벤트 → db_loader) ──
  DbLoadQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-db-load-queue
      VisibilityTimeout: 120
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DbLoadDLQ.Arn
        maxReceiveCount: 3

  DbLoadDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-db-load-dlq
      MessageRetentionPeriod: 604800
      SqsManagedSseEnabled: true
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !GetAtt DbLoadQueue.Arn

  # ── SQS: 소스별 목록 수집 큐 ──
  SourceCollectQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-source-collect-queue
      VisibilityTimeout: 960
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SourceCollectDLQ.Arn
        maxReceiveCount: 2

  SourceCollectDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-source-collect-dlq
      MessageRetentionPeriod: 604800
      SqsManagedSseEnabled: true
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !GetAtt SourceCollectQueue.Arn

  # ── EventBridge 전달 실패용 DLQ ──
  EventBridgeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-eventbridge-dlq
      MessageRetentionPeriod: 604800
      SqsManagedSseEnabled: true

  EventBridgeDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref EventBridgeDLQ
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt EventBridgeDLQ.Arn

  # ── EventBridge: S3 raw/ → EmbedQueue ──
  S3ToEmbedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: passroute-s3-to-embed
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - "Object Created"
        detail:
          bucket:
            name:
              - !Ref CrawlerDataBucketName
          object:
            key:
              - prefix: "raw/"
      Targets:
        - Id: EmbedQueueTarget
          Arn: !GetAtt EmbedQueue.Arn
          DeadLetterConfig:
            Arn: !GetAtt EventBridgeDLQ.Arn

  EmbedQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref EmbedQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt EmbedQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt S3ToEmbedRule.Arn

  # ── EventBridge: S3 parsed/ + delete-requests/ → DbLoadQueue ──
  S3ToDbLoadRule:
    Type: AWS::Events::Rule
    Properties:
      Name: passroute-s3-to-db-load
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - "Object Created"
        detail:
          bucket:
            name:
              - !Ref CrawlerDataBucketName
          object:
            key:
              - prefix: "parsed/"
              - prefix: "delete-requests/"
      Targets:
        - Id: DbLoadQueueTarget
          Arn: !GetAtt DbLoadQueue.Arn
          DeadLetterConfig:
            Arn: !GetAtt EventBridgeDLQ.Arn

  DbLoadQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref DbLoadQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt DbLoadQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt S3ToDbLoadRule.Arn

Outputs:
  # ── Queue URLs (Lambda 환경변수용) ──
  JobDetailQueueUrl:
    Value: !Ref JobDetailQueue
  SourceCollectQueueUrl:
    Value: !Ref SourceCollectQueue
  EmbedQueueUrl:
    Value: !Ref EmbedQueue
  DbLoadQueueUrl:
    Value: !Ref DbLoadQueue
  # ── Queue ARNs (Lambda SQS 트리거용) ──
  JobDetailQueueArn:
    Value: !GetAtt JobDetailQueue.Arn
  SourceCollectQueueArn:
    Value: !GetAtt SourceCollectQueue.Arn
  EmbedQueueArn:
    Value: !GetAtt EmbedQueue.Arn
  DbLoadQueueArn:
    Value: !GetAtt DbLoadQueue.Arn
  # ── Queue Names (Lambda 정책용) ──
  JobDetailQueueName:
    Value: !GetAtt JobDetailQueue.QueueName
  SourceCollectQueueName:
    Value: !GetAtt SourceCollectQueue.QueueName
  EmbedQueueName:
    Value: !GetAtt EmbedQueue.QueueName
  # ── DLQ (모니터링용) ──
  JobDetailDLQArn:
    Value: !GetAtt JobDetailDLQ.Arn
  JobDetailDLQQueueName:
    Value: !GetAtt JobDetailDLQ.QueueName
  SourceCollectDLQArn:
    Value: !GetAtt SourceCollectDLQ.Arn
  SourceCollectDLQQueueName:
    Value: !GetAtt SourceCollectDLQ.QueueName
  EmbedDLQArn:
    Value: !GetAtt EmbedDLQ.Arn
  EmbedDLQQueueName:
    Value: !GetAtt EmbedDLQ.QueueName
  DbLoadDLQArn:
    Value: !GetAtt DbLoadDLQ.Arn
  DbLoadDLQQueueName:
    Value: !GetAtt DbLoadDLQ.QueueName
