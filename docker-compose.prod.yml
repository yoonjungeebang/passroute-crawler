services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-passroute}
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  consumer:
    image: ${ECR_IMAGE}
    environment:
      - S3_BUCKET=${S3_BUCKET:-passroute-crawler-data-0607}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-northeast-2}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-passroute}
      - POLL_INTERVAL=${POLL_INTERVAL:-60}
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pg-data:
