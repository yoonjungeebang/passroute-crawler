# API 핸들러 설정

max_company_length: 50      # 회사명 최대 길이
max_position_length: 30     # position 최대 길이
max_tech_stack: 10          # tech_stack 최대 개수
max_keywords: 10            # 키워드 최대 개수
blog_crawl_delay: 0.5       # 블로그 크롤링 간 대기 (초)
webkr_keyword_display: 5    # 키워드별 웹문서 결과 수
webkr_default_display: 10   # 기본 웹문서 결과 수
ws_connection_ttl: 3600     # WebSocket 연결 TTL (초)
collect_cooldown: 300       # 같은 company 재수집 방지 쿨다운 (초)
