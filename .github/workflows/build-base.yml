name: Build Base Image

on:
  push:
    branches: [main, develop]
    paths:
      - Dockerfile.base
      - src/requirements-docker.txt
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ECR_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: echo "value=base-$(date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ${{ env.ECR_URI }}:${{ steps.tag.outputs.value }}
          cache-from: type=registry,ref=${{ env.ECR_URI }}:${{ steps.tag.outputs.value }}
          cache-to: type=inline

      - name: Update BASE_IMAGE_TAG secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set BASE_IMAGE_TAG \
            --body "${{ steps.tag.outputs.value }}"
