AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  passroute-crawler — 3단계 크롤링 파이프라인 (crawl → embed → load)

Parameters:
  S3BucketName:
    Type: String
    Description: 크롤링 데이터 중간 저장 S3 버킷명
    Default: passroute-crawler-data-0607
  BaseImageUri:
    Type: String
    Description: Lambda 베이스 Docker 이미지 URI (ECR)
    Default: ''
  # ── Secrets Manager ARN ──
  DatabaseSecretArn:
    Type: String
    Description: RDS 접속 정보가 저장된 Secrets Manager ARN
    NoEcho: true
  NaverApiSecretArn:
    Type: String
    Description: 네이버 API 크레덴셜이 저장된 Secrets Manager ARN
    NoEcho: true
  SuperookieApiSecretArn:
    Type: String
    Description: 슈퍼루키 API 액세스 토큰이 저장된 Secrets Manager ARN
    NoEcho: true
    Default: ''
  DiscordWebhookSecretArn:
    Type: String
    Description: Discord 웹훅 URL이 저장된 Secrets Manager ARN
    NoEcho: true
    Default: ''
  # ── VPC 설정 (db_loader Lambda 용) ──
  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Lambda VPC private 서브넷 ID 목록
  VpcSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Lambda VPC 보안 그룹 ID 목록

Globals:
  Function:
    Architectures:
      - x86_64
    Timeout: 300
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        S3_BUCKET: !Ref CrawlerDataBucket

Resources:
  # ── S3: 크롤링 데이터 중간 저장 버킷 (보안 강화) ──
  CrawlerDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: CleanupFailedPrefix
            Prefix: failed/
            Status: Enabled
            ExpirationInDays: 30
          - Id: CleanupRawPrefix
            Prefix: raw/
            Status: Enabled
            ExpirationInDays: 7
          - Id: CleanupParsedPrefix
            Prefix: parsed/
            Status: Enabled
            ExpirationInDays: 3

  # ── SQS: 공고 단위 상세 크롤링 큐 ──
  JobDetailQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-job-detail-queue
      VisibilityTimeout: 360
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobDetailDLQ.Arn
        maxReceiveCount: 3

  JobDetailDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-job-detail-dlq
      MessageRetentionPeriod: 604800

  # ── SQS: 임베딩 큐 (S3 raw/ 이벤트 → embed_worker) ──
  EmbedQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-embed-queue
      VisibilityTimeout: 360
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EmbedDLQ.Arn
        maxReceiveCount: 3

  EmbedDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-embed-dlq
      MessageRetentionPeriod: 604800

  # ── SQS: DB 적재 큐 (S3 parsed/ 이벤트 → db_loader) ──
  DbLoadQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-db-load-queue
      VisibilityTimeout: 120
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DbLoadDLQ.Arn
        maxReceiveCount: 3

  DbLoadDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-db-load-dlq
      MessageRetentionPeriod: 604800

  # ── SQS: 소스별 목록 수집 큐 ──
  SourceCollectQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-source-collect-queue
      VisibilityTimeout: 960
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SourceCollectDLQ.Arn
        maxReceiveCount: 2

  SourceCollectDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-source-collect-dlq
      MessageRetentionPeriod: 604800

  # ── EventBridge: S3 raw/ → EmbedQueue ──
  S3ToEmbedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: passroute-s3-to-embed
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - "Object Created"
        detail:
          bucket:
            name:
              - !Ref CrawlerDataBucket
          object:
            key:
              - prefix: "raw/"
      Targets:
        - Id: EmbedQueueTarget
          Arn: !GetAtt EmbedQueue.Arn

  EmbedQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref EmbedQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt EmbedQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt S3ToEmbedRule.Arn

  # ── EventBridge: S3 parsed/ + delete-requests/ → DbLoadQueue ──
  S3ToDbLoadRule:
    Type: AWS::Events::Rule
    Properties:
      Name: passroute-s3-to-db-load
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - "Object Created"
        detail:
          bucket:
            name:
              - !Ref CrawlerDataBucket
          object:
            key:
              - prefix: "parsed/"
              - prefix: "delete-requests/"
      Targets:
        - Id: DbLoadQueueTarget
          Arn: !GetAtt DbLoadQueue.Arn

  DbLoadQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref DbLoadQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt DbLoadQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt S3ToDbLoadRule.Arn

  # ── Stage 1: 목록 수집 디스패처 (cron → 소스별 SQS 메시지) ──
  JobListCollector:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: src/
      Handler: app.job_list_collector
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          SOURCE_COLLECT_QUEUE_URL: !Ref SourceCollectQueue
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SourceCollectQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:aws:s3:::${CrawlerDataBucket}/delete-requests/*"
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 18 * * ? *)
            Enabled: true

  # ── Stage 1: 소스별 목록 수집 워커 (SQS 트리거) ──
  SourceCollectWorker:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: src/
      Handler: app.source_collect_worker
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          JOB_DETAIL_QUEUE_URL: !Ref JobDetailQueue
          DISCORD_WEBHOOK_SECRET_ARN: !Ref DiscordWebhookSecretArn
          SUPEROOKIE_API_SECRET_ARN: !Ref SuperookieApiSecretArn
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobDetailQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:aws:s3:::${CrawlerDataBucket}/url-index.json"
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref DiscordWebhookSecretArn
                - !Ref SuperookieApiSecretArn
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt SourceCollectQueue.Arn
            BatchSize: 1

  # ── Stage 1: 상세 크롤러 (Tier 2 HTML/API 크롤링) ──
  JobCrawler:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: src/
      Handler: app.job_crawl
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          SUPEROOKIE_API_SECRET_ARN: !Ref SuperookieApiSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:aws:s3:::${CrawlerDataBucket}/raw/*"
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref SuperookieApiSecretArn
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt JobDetailQueue.Arn
            BatchSize: 1

  # ── Stage 1: 뉴스 수집 (cron) ──
  NewsCollector:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: src/
      Handler: app.news_collector
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          NAVER_API_SECRET_ARN: !Ref NaverApiSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:aws:s3:::${CrawlerDataBucket}/raw/*"
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:aws:s3:::${CrawlerDataBucket}/url-index.json"
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref NaverApiSecretArn
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 19 * * ? *)
            Enabled: true

  # ── Stage 1: 기술 블로그 수집 (cron, 임베딩 없음) ──
  BlogCollector:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: src/
      Handler: app.blog_collector
      Timeout: 900
      MemorySize: 512
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:aws:s3:::${CrawlerDataBucket}/raw/*"
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:aws:s3:::${CrawlerDataBucket}/url-index.json"
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 20 * * ? *)
            Enabled: true

  # ── Stage 2: 통합 임베딩 워커 (SQS 트리거, Docker 이미지) ──
  EmbedWorker:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Timeout: 120
      MemorySize: 2048
      ImageConfig:
        Command:
          - app.embed_worker
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub "arn:aws:s3:::${CrawlerDataBucket}/raw/*"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "arn:aws:s3:::${CrawlerDataBucket}/parsed/*"
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt EmbedQueue.Arn
            BatchSize: 1
    Metadata:
      DockerTag: python3.11
      DockerContext: .
      Dockerfile: src/Dockerfile
      DockerBuildArgs:
        BASE_IMAGE: !Ref BaseImageUri

  # ── Stage 3: DB 로더 (SQS 트리거, S3 parsed/ 이벤트 → PostgreSQL) ──
  DbLoader:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: src/
      Handler: app.db_loader
      Timeout: 60
      MemorySize: 256
      ReservedConcurrentExecutions: 5
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds: !Ref VpcSecurityGroupIds
      Environment:
        Variables:
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource:
                - !Sub "arn:aws:s3:::${CrawlerDataBucket}/parsed/*"
                - !Sub "arn:aws:s3:::${CrawlerDataBucket}/delete-requests/*"
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DatabaseSecretArn
        - VPCAccessPolicy: {}
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt DbLoadQueue.Arn
            BatchSize: 1

  # ── url-index.json 재구축 (cron, PostgreSQL → S3) ──
  UrlIndexRebuilder:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: src/
      Handler: app.url_index_rebuilder
      Timeout: 120
      MemorySize: 256
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds: !Ref VpcSecurityGroupIds
      Environment:
        Variables:
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:aws:s3:::${CrawlerDataBucket}/url-index.json"
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DatabaseSecretArn
        - VPCAccessPolicy: {}
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(30 20 * * ? *)
            Enabled: true

  # ── Phase 4: 검색 API (API Gateway) ──
  SearchApi:
    Type: AWS::Serverless::Function
    Metadata:
      DockerTag: search-api
      DockerContext: .
      Dockerfile: src/Dockerfile
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - app.search_api
      Timeout: 30
      MemorySize: 2048
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds: !Ref VpcSecurityGroupIds
      Environment:
        Variables:
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
          NAVER_API_SECRET_ARN: !Ref NaverApiSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref DatabaseSecretArn
                - !Ref NaverApiSecretArn
        - VPCAccessPolicy: {}
      Events:
        SearchGet:
          Type: Api
          Properties:
            Path: /api/search
            Method: get
            RestApiId: !Ref PassrouteApi

  PassrouteApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  # ── DLQ 알람 → Discord 알림 ──
  DLQAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: passroute-dlq-alarm
      DisplayName: passroute DLQ Alarm

  DLQDiscordNotifier:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: src/
      Handler: core.notify.discord_notifier
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          DISCORD_WEBHOOK_SECRET_ARN: !Ref DiscordWebhookSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DiscordWebhookSecretArn
      Events:
        SNSTrigger:
          Type: SNS
          Properties:
            Topic: !Ref DLQAlarmTopic

  DLQDailyCheck:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: src/
      Handler: core.notify.dlq_daily_check
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          DISCORD_WEBHOOK_SECRET_ARN: !Ref DiscordWebhookSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sqs:GetQueueAttributes
              Resource:
                - !GetAtt JobDetailDLQ.Arn
                - !GetAtt SourceCollectDLQ.Arn
                - !GetAtt EmbedDLQ.Arn
                - !GetAtt DbLoadDLQ.Arn
        - Statement:
            - Effect: Allow
              Action:
                - sts:GetCallerIdentity
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DiscordWebhookSecretArn
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 21 * * ? *)
            Enabled: true

  # ── DLQ 알람 (CloudWatch) ──
  JobDetailDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: passroute-job-detail-dlq-has-messages
      AlarmDescription: passroute job detail DLQ에 메시지가 쌓여 있음 (상세 크롤링 실패 누적)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt JobDetailDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref DLQAlarmTopic
      OKActions:
        - !Ref DLQAlarmTopic

  SourceCollectDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: passroute-source-collect-dlq-has-messages
      AlarmDescription: passroute source collect DLQ에 메시지가 쌓여 있음 (소스별 수집 실패)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SourceCollectDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref DLQAlarmTopic
      OKActions:
        - !Ref DLQAlarmTopic

  EmbedDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: passroute-embed-dlq-has-messages
      AlarmDescription: passroute embed DLQ에 메시지가 쌓여 있음 (임베딩 실패 누적)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EmbedDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref DLQAlarmTopic
      OKActions:
        - !Ref DLQAlarmTopic

  DbLoadDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: passroute-db-load-dlq-has-messages
      AlarmDescription: passroute DB load DLQ에 메시지가 쌓여 있음 (DB 적재 실패 누적)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DbLoadDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref DLQAlarmTopic
      OKActions:
        - !Ref DLQAlarmTopic

Outputs:
  JobListCollectorArn:
    Description: 목록 수집 Lambda ARN
    Value: !GetAtt JobListCollector.Arn
  JobCrawlerArn:
    Description: 상세 크롤링 Lambda ARN
    Value: !GetAtt JobCrawler.Arn
  JobDetailQueueUrl:
    Description: 상세 SQS Queue URL
    Value: !Ref JobDetailQueue
  CrawlerDataBucketName:
    Description: 크롤링 데이터 S3 버킷명
    Value: !Ref CrawlerDataBucket
  NewsCollectorArn:
    Description: 뉴스 수집 Lambda ARN
    Value: !GetAtt NewsCollector.Arn
  BlogCollectorArn:
    Description: 블로그 수집 Lambda ARN
    Value: !GetAtt BlogCollector.Arn
  EmbedWorkerArn:
    Description: 임베딩 워커 Lambda ARN
    Value: !GetAtt EmbedWorker.Arn
  EmbedQueueUrl:
    Description: 임베딩 SQS Queue URL
    Value: !Ref EmbedQueue
  DbLoaderArn:
    Description: DB 로더 Lambda ARN
    Value: !GetAtt DbLoader.Arn
  DbLoadQueueUrl:
    Description: DB 로드 SQS Queue URL
    Value: !Ref DbLoadQueue
  SourceCollectWorkerArn:
    Description: 소스별 수집 워커 Lambda ARN
    Value: !GetAtt SourceCollectWorker.Arn
  SourceCollectQueueUrl:
    Description: 소스별 수집 SQS Queue URL
    Value: !Ref SourceCollectQueue
  UrlIndexRebuilderArn:
    Description: URL 인덱스 재구축 Lambda ARN
    Value: !GetAtt UrlIndexRebuilder.Arn
  SearchApiUrl:
    Description: 검색 API 엔드포인트 URL
    Value: !Sub "https://${PassrouteApi}.execute-api.${AWS::Region}.amazonaws.com/prod/api/search"
  DLQAlarmTopicArn:
    Description: DLQ 알람 SNS 토픽 ARN
    Value: !Ref DLQAlarmTopic
