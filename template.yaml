AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  passroute-crawler — 잡코리아 JD 크롤링 파이프라인

Parameters:
  S3BucketName:
    Type: String
    Description: 크롤링 데이터 중간 저장 S3 버킷명
    Default: passroute-crawler-data-0607
  DiscordWebhookUrl:
    Type: String
    Description: DLQ 알람 Discord 웹훅 URL
    NoEcho: true
    Default: ''
  GcpSaKeyB64:
    Type: String
    Description: GCP 서비스 계정 JSON 키 (base64 인코딩)
    NoEcho: true
    Default: ''
  NaverClientId:
    Type: String
    Description: 네이버 개발자 센터 클라이언트 ID
    NoEcho: true
    Default: ''
  NaverClientSecret:
    Type: String
    Description: 네이버 개발자 센터 클라이언트 Secret
    NoEcho: true
    Default: ''
  BaseImageUri:
    Type: String
    Description: Lambda 베이스 Docker 이미지 URI (ECR)
    Default: ''

Globals:
  Function:
    Architectures:
      - x86_64
    Timeout: 300
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        S3_BUCKET: !Ref CrawlerDataBucket
        JOBKOREA_MAX_PAGES: '10'

Resources:
  # ── S3: 크롤링 데이터 중간 저장 버킷 ──
  CrawlerDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3BucketName
      LifecycleConfiguration:
        Rules:
          - Id: CleanupFailedPrefix
            Prefix: failed/
            Status: Enabled
            ExpirationInDays: 30

  # ── SQS: 공고 단위 상세 크롤링 큐 ──
  JobDetailQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-job-detail-queue
      VisibilityTimeout: 360
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobDetailDLQ.Arn
        maxReceiveCount: 3

  JobDetailDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-job-detail-dlq
      MessageRetentionPeriod: 604800

  # ── Lambda 1: 목록 수집 (cron) ──
  JobListCollector:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: src/
      Handler: app.job_list_collector
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          JOB_DETAIL_QUEUE_URL: !Ref JobDetailQueue
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobDetailQueue.QueueName
        - S3CrudPolicy:
            BucketName: !Ref CrawlerDataBucket
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 18 * * ? *)
            Enabled: true

  # ── DLQ 알람 → Discord 알림 ──
  DLQAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: passroute-dlq-alarm
      DisplayName: passroute DLQ Alarm

  DLQDiscordNotifier:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: src/
      Handler: notify.discord_notifier
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          DISCORD_WEBHOOK_URL: !Ref DiscordWebhookUrl
      Events:
        SNSTrigger:
          Type: SNS
          Properties:
            Topic: !Ref DLQAlarmTopic

  DLQDailyCheck:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: src/
      Handler: notify.dlq_daily_check
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          DISCORD_WEBHOOK_URL: !Ref DiscordWebhookUrl
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobDetailDLQ.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt BlogEmbeddingDLQ.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - sqs:GetQueueAttributes
              Resource:
                - !GetAtt JobDetailDLQ.Arn
                - !GetAtt BlogEmbeddingDLQ.Arn
        - Statement:
            - Effect: Allow
              Action:
                - sts:GetCallerIdentity
              Resource: "*"
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 21 * * ? *)
            Enabled: true

  JobDetailDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: passroute-job-detail-dlq-has-messages
      AlarmDescription: passroute job detail DLQ에 메시지가 쌓여 있음 (상세 크롤링 실패 누적)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt JobDetailDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref DLQAlarmTopic
      OKActions:
        - !Ref DLQAlarmTopic

  # ── Lambda 3: 뉴스 수집 (cron) ──
  NewsCollector:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Timeout: 900
      MemorySize: 1536
      ImageConfig:
        Command:
          - app.news_collector
      Environment:
        Variables:
          NAVER_CLIENT_ID: !Ref NaverClientId
          NAVER_CLIENT_SECRET: !Ref NaverClientSecret
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref CrawlerDataBucket
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 19 * * ? *)
            Enabled: true
    Metadata:
      DockerTag: python3.11
      DockerContext: .
      Dockerfile: src/Dockerfile
      DockerBuildArgs:
        BASE_IMAGE: !Ref BaseImageUri

  # ── SQS: 블로그 임베딩 큐 ──
  BlogEmbeddingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-blog-embedding-queue
      VisibilityTimeout: 360
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BlogEmbeddingDLQ.Arn
        maxReceiveCount: 3

  BlogEmbeddingDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: passroute-blog-embedding-dlq
      MessageRetentionPeriod: 604800

  BlogEmbeddingDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: passroute-blog-embedding-dlq-has-messages
      AlarmDescription: passroute blog embedding DLQ에 메시지가 쌓여 있음
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt BlogEmbeddingDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref DLQAlarmTopic
      OKActions:
        - !Ref DLQAlarmTopic

  # ── Lambda 4: 기술 블로그 수집 (cron) ──
  BlogCollector:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: src/
      Handler: app.blog_collector
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          BLOG_EMBEDDING_QUEUE_URL: !Ref BlogEmbeddingQueue
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt BlogEmbeddingQueue.QueueName
        - S3CrudPolicy:
            BucketName: !Ref CrawlerDataBucket
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 20 * * ? *)
            Enabled: true

  # ── Lambda 5: 블로그 임베딩 (SQS 트리거) ──
  BlogEmbedding:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Timeout: 120
      MemorySize: 2048
      ImageConfig:
        Command:
          - app.blog_embedding
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref CrawlerDataBucket
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt BlogEmbeddingQueue.Arn
            BatchSize: 1
    Metadata:
      DockerTag: python3.11
      DockerContext: .
      Dockerfile: src/Dockerfile
      DockerBuildArgs:
        BASE_IMAGE: !Ref BaseImageUri

  # ── Lambda 2: 상세 크롤러 + 임베딩 (컨테이너 이미지) ──
  JobDetailCrawler:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Timeout: 120
      MemorySize: 1536
      Environment:
        Variables:
          GCP_SA_KEY_B64: !Ref GcpSaKeyB64
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref CrawlerDataBucket
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt JobDetailQueue.Arn
            BatchSize: 1
    Metadata:
      DockerTag: python3.11
      DockerContext: .
      Dockerfile: src/Dockerfile
      DockerBuildArgs:
        BASE_IMAGE: !Ref BaseImageUri

Outputs:
  JobListCollectorArn:
    Description: 목록 수집 Lambda ARN
    Value: !GetAtt JobListCollector.Arn
  JobDetailCrawlerArn:
    Description: 상세 크롤링 Lambda ARN
    Value: !GetAtt JobDetailCrawler.Arn
  JobDetailQueueUrl:
    Description: 상세 SQS Queue URL
    Value: !Ref JobDetailQueue
  CrawlerDataBucketName:
    Description: 크롤링 데이터 S3 버킷명
    Value: !Ref CrawlerDataBucket
  NewsCollectorArn:
    Description: 뉴스 수집 Lambda ARN
    Value: !GetAtt NewsCollector.Arn
  BlogCollectorArn:
    Description: 블로그 수집 Lambda ARN
    Value: !GetAtt BlogCollector.Arn
  BlogEmbeddingArn:
    Description: 블로그 임베딩 Lambda ARN
    Value: !GetAtt BlogEmbedding.Arn
  BlogEmbeddingQueueUrl:
    Description: 블로그 임베딩 SQS Queue URL
    Value: !Ref BlogEmbeddingQueue
  DLQAlarmTopicArn:
    Description: DLQ 알람 SNS 토픽 ARN
    Value: !Ref DLQAlarmTopic
