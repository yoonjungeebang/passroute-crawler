services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-passroute}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-passroute}
      - POSTGRES_DB=${POSTGRES_DB:-passroute}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-passroute}"]
      interval: 10s
      retries: 5

volumes:
  pg-data:
